# Mosquitto-Konfiguration fuer die MQTT-Mocks (reine Testumgebung).
# Anonymer Zugriff ist bewusst erlaubt - der Broker ist nur an localhost gebunden
# (siehe Portmapping in compose.yaml) und haelt keine Daten vor.

listener 1883
allow_anonymous true

# Keine Persistenz: nach einem Neustart ist der Broker leer.
persistence false

# Log nach stdout, damit "docker logs mqtt-mock-broker" alles zeigt.
log_dest stdout
log_timestamp true
connection_messages true
