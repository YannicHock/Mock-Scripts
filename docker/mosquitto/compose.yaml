# MQTT-Broker fuer die beiden Mock-Skripte.
#
#   docker compose -f docker/mosquitto/compose.yaml up -d     starten
#   docker compose -f docker/mosquitto/compose.yaml down       stoppen und entfernen
#   docker logs -f mqtt-mock-broker                            mitlesen
#
# Bewusst ohne restart-Policy: der Broker kommt nicht ungefragt beim Booten hoch.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt-mock-broker
    # Nur an localhost gebunden - der Broker ist von aussen nicht erreichbar.
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
